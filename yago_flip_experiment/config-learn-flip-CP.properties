# AnyBURL, closed-path (cyclic) rules ONLY, for YAGO4.5-10-flip.
# Mirrors the closed-path-only recipe used for the main datasets
# (tools/setup/<dataset>/config-learn-onlyCP.properties):
#   MAX_LENGTH_ACYCLIC = 0          -> no acyclic rules
#   MAX_LENGTH_GROUNDED_CYCLIC = 0  -> no constant-instantiated cyclic rules
#   MAX_LENGTH_CYCLIC = 3           -> closed paths up to length 3
# Everything else matches config-learn-flip.properties so ALL vs CP is a clean
# comparison. Paths relative to this directory.

PATH_TRAINING = ./data/YAGO4.5-10-flip_train.tsv
PATH_OUTPUT   = ./rules/YAGO4.5-10-flip_rules_anyburl_CP

SNAPSHOTS_AT = 100,300

# The reference config uses WORKER_THREADS = 1; that is impractical on a
# 3.2M-triple graph, so 8 here (same as the ALL run, keeping the two comparable).
WORKER_THREADS = 8

THRESHOLD_CONFIDENCE = 0.1
THRESHOLD_CORRECT_PREDICTIONS = 2

MAX_LENGTH_ACYCLIC = 0
MAX_LENGTH_GROUNDED_CYCLIC = 0
MAX_LENGTH_CYCLIC = 3

ZERO_RULES_ACTIVE = false
REWRITE_REFLEXIV = false

# false: matches how the repo's published rule sets were actually mined
SAFE_PREFIX_MODE = false
