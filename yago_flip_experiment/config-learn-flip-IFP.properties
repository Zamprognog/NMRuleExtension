# AnyBURL restricted to inverse-functional HEADS only.
#
# The graph-wide materialization run showed that rules with birthPlaceOf /
# deathPlaceOf heads are too low-confidence to survive the top-1/5/10% cut: across
# 18 files and 5.9M inferred triples the flipped relations appeared 258 times, all
# in the FULL-10% files. Restricting heads here guarantees every mined rule -- and
# therefore every materialized triple -- targets an inverse-functional relation.
#
# SINGLE_RELATIONS is split on "," with NO trimming (IOHelper.getProperty), so no
# spaces around the comma. SAFE_PREFIX_MODE must stay false, otherwise AnyBURL
# prefixes relations with "r" internally and these plain URIs match nothing.

PATH_TRAINING = ./data/YAGO4.5-10-flip_train.tsv
PATH_OUTPUT   = ./rules/YAGO4.5-10-flip_rules_anyburl_IFP

SNAPSHOTS_AT = 300
WORKER_THREADS = 4

THRESHOLD_CONFIDENCE = 0.01
THRESHOLD_CORRECT_PREDICTIONS = 2

MAX_LENGTH_ACYCLIC = 3
MAX_LENGTH_GROUNDED_CYCLIC = 3
MAX_LENGTH_CYCLIC = 3

ZERO_RULES_ACTIVE = false
REWRITE_REFLEXIV = false
SAFE_PREFIX_MODE = false

SINGLE_RELATIONS = http://yago-knowledge.org/resource/birthPlaceOf,http://yago-knowledge.org/resource/deathPlaceOf
